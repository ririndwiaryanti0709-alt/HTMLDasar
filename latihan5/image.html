<!-- <img src="logo1.png>"-->
<!-- 
atributnya :
src = untuk menampilkan foto dari internal/eksternal url
alt = untuk memberikan deskripsi/ alternatif text agar kalau fotonya tidak tampil maka akan tampil teksnya 
title = digunakan untuk memberikan teks pada gambar jika di klik
width = lebar gambar 
height = tinggi gambar

untuk width dan height bisa gunakan px untuk dan juga % 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image html</title>
</head>
<body>
    <img src="ririn.JPG" alt="foto ririn cantik" width="200">
    <br><br>
    <img src="logo1.png" alt="logo ririn" title="logoku" width="50%" >
    <br>


    <a href="https://github.com/ririndwiaryanti0709-alt">
        <img src="logo2.png" alt="link foto" width="200px">
    </a>
</body>
</html>
