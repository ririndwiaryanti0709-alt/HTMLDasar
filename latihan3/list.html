<!-- list html -->
<!-- 
jenis jenis list pada html:
1. ol (order list) = list terurut
2. ul (unorder list) = list tidak terurut
3. dl (definition list) = untuk membuat daftar terminologi dan definisi.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List HTML</title>
</head>
<body>
    <!-- 
    untuk ol jika ingin mengurutkan berdasarkan angka, atau huruf besar/romawi 
    bisa gunakan type i, A, a, dll -->
    <h3>To Do List</h3>
    <ol type="i"> 
        <li>belajar html</li>
        <li>belajar css</li>
        <li>belajar javascript</li>
    </ol>


    <!-- ada 3 type ul yaitu dics, squere circle -->
    <h3>Jadwal Belajar</h3>
    <ul type="circle">
        <li>jam 7:30</li>
        <li>jam 9:45</li>
        <li>jam 20:00</li>
    </ul>

    <!-- tag strong untuk menebalkan teks -->
    <h3>Pemrograman web</h3>
    <dl>
        <dt><strong>HTML</strong></dt>   <!-- term 1 / judul -->
        <dd>Hypertext Markup Language</dd>
        <dt><strong>CSS</strong></dt>
        <dd>Cascading Style Sheet</dd>
    </dl>
    
</body>
</html>
